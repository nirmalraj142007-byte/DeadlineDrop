<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeadlineDrop — Submit Assignment</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header>
    <a href="/" class="brand">DeadlineDrop</a>
    <nav>
      <a href="/student/assignments.html" class="btn">Assignments</a>
      <span id="user-display" class="chip chip-muted">Student</span>
      <button type="button" id="sign-out-btn" class="btn">Sign out</button>
    </nav>
  </header>

  <main>
    <div id="state-container"></div>

    <div id="submit-card" class="card">
      <div class="submit-header">
        <h2 id="assignment-title">Submit Assignment</h2>
        <p id="arm-label" class="arm-label visually-hidden"></p>
      </div>

      <div class="assignment-meta">
        <div class="assignment-meta-item">
          <span class="assignment-meta-label">Deadline (IST)</span>
          <span id="meta-deadline" class="assignment-meta-value">—</span>
        </div>
        <div class="assignment-meta-item">
          <span class="assignment-meta-label">Time Remaining</span>
          <span id="meta-countdown" class="assignment-meta-value">—</span>
        </div>
        <div class="assignment-meta-item">
          <span class="assignment-meta-label">Grace Window</span>
          <span id="meta-grace" class="assignment-meta-value">—</span>
        </div>
        <div class="assignment-meta-item">
          <span class="assignment-meta-label">Max Size</span>
          <span id="meta-max-size" class="assignment-meta-value">—</span>
        </div>
        <div class="assignment-meta-item">
          <span class="assignment-meta-label">Allowed Types</span>
          <span id="meta-allowed-types" class="assignment-meta-value">—</span>
        </div>
      </div>

      <form id="submit-form" novalidate>
        <div class="form-group">
          <label for="file-input">Select file</label>
          <input type="file" id="file-input">
          <div id="file-error" class="banner banner-error visually-hidden"></div>
          <p id="file-info" class="text-muted"></p>
        </div>

        <div id="progress-container" class="progress-wrapper visually-hidden">
          <p id="progress-status" class="progress-status-text" aria-live="polite" role="status"></p>
          <div class="progress">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" disabled>Submit</button>
      </form>

      <div id="result-panel" class="card visually-hidden" aria-live="polite" role="status"></div>
    </div>
  </main>

  <footer>
    <p>DeadlineDrop — Hash commitment assignment portal</p>
  </footer>

  <script type="module" src="/js/shell.js"></script>
  <script type="module" src="/js/submit.js"></script>
</body>
</html>
