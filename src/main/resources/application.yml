spring:
  application:
    name: deadlinedrop
  mvc:
    problemdetails:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 2
      connection-timeout: 2000
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

dd:
  jwt:
    ttl: PT12H
  storage:
    root: ${DD_STORAGE_ROOT:/data/objects}
    public-base-url: ${DD_STORAGE_PUBLIC_BASE_URL:http://localhost:9000}
    hmac-secret: ${DD_STORAGE_HMAC_SECRET}

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
