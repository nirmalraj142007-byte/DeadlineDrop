spring:
  application:
    name: deadlinedrop
  mvc:
    problemdetails:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 2
      connection-timeout: 2000
      # A pooled connection is checked before use; a dead one must fail well inside the 2 s budget.
      validation-timeout: 1000
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

dd:
  jwt:
    ttl: PT12H
  internal:
    # Cloud only (ignored under local and test): Cloud Scheduler's OIDC token. Both blank = deny all.
    oidc:
      audience: ${INTERNAL_AUDIENCE:}
      scheduler-email: ${SCHEDULER_SA_EMAIL:}
  chaos:
    # Off by default: with the flag off /admin/chaos/** does not exist (404).
    enabled: ${CHAOS_ENABLED:false}
  storage:
    root: ${DD_STORAGE_ROOT:/data/objects}
    public-base-url: ${DD_STORAGE_PUBLIC_BASE_URL:http://localhost:9000}
    hmac-secret: ${DD_STORAGE_HMAC_SECRET}

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
