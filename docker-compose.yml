services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dd_c
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d dd_c"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DD_STORAGE_HMAC_SECRET: ${DD_STORAGE_HMAC_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - objects:/data/objects
    ports:
      - "8080:8080"

  # Plays Cloud Scheduler locally: every 60 s, reconcile then drain the job queue over HTTP.
  # $$ leaves $INTERNAL_TOKEN for the container's shell, so the token is not baked into the command.
  scheduler:
    image: curlimages/curl:8.11.1
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        while true;
        do curl -s -w '\n' -X POST -H "X-Internal-Token: $$INTERNAL_TOKEN" http://app:8080/internal/reconcile;
        curl -s -w '\n' -X POST -H "X-Internal-Token: $$INTERNAL_TOKEN" http://app:8080/internal/jobs/drain;
        sleep 60;
        done
    depends_on:
      - app

  app-arma:
    profiles: ["arms"]
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local,naive
      DB_HOST: postgres
      DB_NAME: dd_a
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DD_STORAGE_HMAC_SECRET: ${DD_STORAGE_HMAC_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - objects:/data/objects
    ports:
      - "8082:8080"

  app-armb:
    profiles: ["arms"]
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local,direct-finalize
      DB_HOST: postgres
      DB_NAME: dd_b
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DD_STORAGE_HMAC_SECRET: ${DD_STORAGE_HMAC_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - objects:/data/objects
    ports:
      - "8083:8080"

  storage:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: storage
      DD_STORAGE_HMAC_SECRET: ${DD_STORAGE_HMAC_SECRET}
    volumes:
      - objects:/data/objects
    ports:
      - "9000:9000"

volumes:
  pgdata:
  objects:
