# Demo front door: one address (:8080) in front of two arm C replicas.
# Used only by docker-compose.demo.yml; the cloud uses Cloud Run's own load balancer.
worker_processes 1;
events { worker_connections 1024; }

http {
  access_log off;

  upstream deadlinedrop {
    server app-c1:8080 max_fails=1 fail_timeout=2s;
    server app-c2:8080 max_fails=1 fail_timeout=2s;
  }

  server {
    listen 8080;
    client_max_body_size 1m;   # arm C never carries file bytes through the app

    location = /nginx-health {
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://deadlinedrop;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 1s;
      proxy_read_timeout 30s;

      # Retry the next replica when one is down or answers 502/503.
      # nginx will NOT resend a POST on its own (non-idempotent methods are never retried
      # once they have been sent to an upstream). That is fine here: the browser and k6 both
      # retry a failed commit with the SAME Idempotency-Key, so the retry cannot double-submit.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }
}
