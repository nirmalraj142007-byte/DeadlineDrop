name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check frozen evidence paths
        run: bash tools/check-frozen.sh

      - name: Check for banned terms
        run: bash tools/check-terms.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Cache Maven wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Download Maven via the wrapper (retry on transient errors)
        run: |
          for attempt in 1 2 3 4; do
            ./mvnw -B -v && exit 0
            echo "Wrapper download failed (attempt ${attempt}); retrying in 20 s"
            sleep 20
          done
          exit 1

      - name: Run build and tests
        run: ./mvnw -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Looks every Maven dependency (direct and transitive, resolved from pom.xml) up in the OSV
  # database. A finding fails the job: upgrade the dependency, or record the decision in
  # docs/decisions.md D13 and add an entry to osv-scanner.toml. SARIF upload is off: it needs
  # GitHub code scanning, which this private repository does not have.
  dependency-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.0.2
    with:
      upload-sarif: false
      scan-args: |-
        --lockfile=pom.xml
        --config=osv-scanner.toml

  # Drives the real compose stack over HTTP with k6: a student's happy path, then a run with
  # Postgres paused for 10 s. k6 is pinned to the version in tools/README.md.
  e2e:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'

      - name: Create .env with generated secrets
        run: |
          cp .env.example .env
          {
            echo "JWT_SECRET=$(openssl rand -base64 48)"
            echo "TELEMETRY_SALT=$(openssl rand -base64 32)"
            echo "RECEIPT_HMAC_KEY=$(openssl rand -base64 32)"
            echo "INTERNAL_TOKEN=$(openssl rand -base64 32)"
          } > secrets.env
          for key in JWT_SECRET TELEMETRY_SALT RECEIPT_HMAC_KEY INTERNAL_TOKEN; do
            sed -i "/^${key}=/d" .env
          done
          cat secrets.env >> .env
          rm secrets.env

      - name: Run the end-to-end tests
        run: make e2e

      - name: Upload k6 output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: target/e2e
